<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topper Portal</title><link rel="stylesheet" href="app.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body><main><header><h1>Topper Interview Copilot</h1><button id="logout" class="ghost hidden">Log out</button></header><section id="auth" class="card"><h2>Login or create account</h2><input id="name" placeholder="Name (registration)"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (minimum 8 characters)"><div class="row"><button id="login">Login</button><button id="register" class="ghost">Create account</button></div><p id="authMsg"></p></section><section id="account" class="hidden"><div class="grid"><div class="card hero"><span>Remaining credits</span><strong id="remaining">--</strong><button id="buy">Buy 60 credits · ₹599</button><button id="launch" class="ghost">Launch Topper</button><small>Topper desktop app must be installed. Use the same email in the app.</small></div><div class="card"><h2>Account</h2><div id="profile"></div></div></div><div class="card"><h2>Credit and payment history</h2><div id="history"></div></div><section id="admin" class="card hidden"><h2>Admin dashboard</h2><div id="stats"></div><div class="row"><input id="creditEmail" placeholder="User email"><input id="creditMinutes" type="number" placeholder="Minutes (+/-)"><button id="addCredits">Apply credits</button></div><div id="users"></div></section></section></main><script src="app.js"></script></body></html>
